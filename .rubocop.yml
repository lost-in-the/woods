AllCops:
  NewCops: enable
  TargetRubyVersion: 3.0
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'bench/**/*'

# ── Metrics exclusions ──
# AST visitors, extractors, MCP registries, flow analysis, and core
# orchestration files have complex methods by nature. Decomposition
# would scatter related logic without improving readability.

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - 'lib/tasks/**/*'
    - '*.gemspec'
    - 'lib/woods/ast/**/*'
    - 'lib/woods/extractors/**/*'
    - 'lib/woods/mcp/**/*'
    - 'lib/woods/retrieval/**/*'
    - 'lib/woods/flow_*.rb'
    - 'lib/woods/flow_analysis/**/*'
    - 'lib/woods/ruby_analyzer/**/*'
    - 'lib/woods/extractor.rb'
    - 'lib/woods/extracted_unit.rb'
    - 'lib/woods/dependency_graph.rb'
    - 'lib/woods/graph_analyzer.rb'
    - 'lib/woods/unblocked/**/*'
    - 'lib/woods/obsidian/**/*'
    - 'lib/woods/explorer/**/*'
  AllowedMethods:
    - 'refine'

Metrics/ModuleLength:
  Exclude:
    - 'lib/woods/ast/**/*'
    - 'lib/woods/extractors/**/*'
    - 'lib/woods/mcp/**/*'
    - 'lib/woods/retrieval/**/*'
    - 'lib/woods/flow_*.rb'
    - 'lib/woods/flow_analysis/**/*'
    - 'lib/woods/ruby_analyzer/**/*'
    - 'lib/woods/extractor.rb'
    - 'lib/woods/extracted_unit.rb'
    - 'lib/woods/dependency_graph.rb'
    - 'lib/woods/graph_analyzer.rb'
    - 'lib/woods/unblocked/**/*'
    - 'lib/woods/obsidian/**/*'
    - 'lib/woods/explorer/**/*'

Metrics/ClassLength:
  Exclude:
    - 'lib/woods/ast/**/*'
    - 'lib/woods/extractors/**/*'
    - 'lib/woods/mcp/**/*'
    - 'lib/woods/retrieval/**/*'
    - 'lib/woods/flow_*.rb'
    - 'lib/woods/flow_analysis/**/*'
    - 'lib/woods/ruby_analyzer/**/*'
    - 'lib/woods/cache/cache_middleware.rb'
    - 'lib/woods/extractor.rb'
    - 'lib/woods/extracted_unit.rb'
    - 'lib/woods/dependency_graph.rb'
    - 'lib/woods/graph_analyzer.rb'
    - 'lib/woods/unblocked/**/*'
    - 'lib/woods/obsidian/**/*'
    - 'lib/woods/explorer/**/*'

Metrics/MethodLength:
  Max: 20
  Exclude:
