    - 'lib/woods/extractor.rb'
    - 'lib/woods/extracted_unit.rb'
    - 'lib/woods/dependency_graph.rb'
    - 'lib/woods/graph_analyzer.rb'
    - 'lib/woods/retriever.rb'
    - 'lib/woods/unblocked/**/*'
    - 'lib/woods/obsidian/**/*'
    - 'lib/woods/explorer/**/*'

# MCP descriptions, GraphQL schemas, and regex patterns exceed 120 chars
Layout/LineLength:
  Exclude:
    - 'lib/woods/mcp/**/*'
    - 'lib/woods/extractors/**/*'
    - 'lib/tasks/**/*'

# Short param names are conventional in comparison/math methods
Naming/MethodParameterName:
  Exclude:
    - 'lib/woods/ruby_analyzer/trace_enricher.rb'
    - 'lib/woods/flow_assembler.rb'

# Renaming predicate methods would break callers
Naming/PredicateMethod:
  Exclude:
    - 'lib/woods/extractors/**/*'

# Safe navigation chains in extractors reflect optional DB metadata
Style/SafeNavigationChainLength:
  Exclude:
    - 'lib/woods/extractors/**/*'

# GraphQL classification and document builder type dispatch intentionally
# enumerate all types with shared fallback branches
Lint/DuplicateBranch:
  Exclude:
    - 'lib/woods/extractors/graphql_extractor.rb'
    - 'lib/woods/unblocked/document_builder.rb'

# MCP gem requires `server_context:` keyword in tool blocks for dispatch.
# The parameter is unused in most handlers but must be present.
Lint/UnusedBlockArgument:
  Exclude:
    - 'lib/woods/mcp/server.rb'
    - 'lib/woods/console/server.rb'

# Top-level module docs already in CLAUDE.md/README
Style/Documentation:
  Enabled: false
