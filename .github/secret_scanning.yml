# Secret-scanning path exclusions.
#
# `paths-ignore` applies to BOTH secret-scanning alerts AND push protection
# (GitHub docs: "Excluding folders and files from secret scanning" — covers
# push protection under the same config).
#
# Exclusions here must be narrow. Over-broad rules let real leaks through.
#
# spec/** — the Console MCP defense specs need credential-shaped strings as
# fixtures to prove CredentialScanner redacts them. Fixtures use Stripe's
# documented test value (`sk_test_4eC39HqLyjWDarjtT1zdp7dc`) and AWS's
# documented example (`AKIAIOSFODNN7EXAMPLE`) — not real credentials, but
# partner detectors match on shape+prefix, not allowlisted suffixes.
#
# lib/woods/console/credential_scanner.rb — the YARD example on the #scan
# method demonstrates redaction on a Stripe-shaped input. Narrow to the
# single file; every other file under lib/ remains protected.
paths-ignore:
  - "spec/**"
  - "lib/woods/console/credential_scanner.rb"
