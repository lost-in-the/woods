name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish (for example, v2.0.0)
        required: true
        type: string
      ci_run_id:
        description: Successful CI workflow run ID for this tag
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  release-context:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      release-sha: ${{ steps.run.outputs.release-sha }}
      tag: ${{ steps.run.outputs.tag }}
      artifact-name: ${{ steps.run.outputs.artifact-name }}
      gem-name: ${{ steps.release.outputs.gem-name }}
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Validate the named CI run through the GitHub API
        id: run
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: script/validate-release-run
      - name: Check out the exact tested SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          ref: ${{ steps.run.outputs.release-sha }}
          fetch-depth: 0
      - name: Set up Ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1
        with:
          ruby-version: '3.3'
      - name: Validate release tag, history, changelog, and publication state
        id: release
        env:
          RELEASE_MAIN_REF: origin/main
          RELEASE_SHA: ${{ steps.run.outputs.release-sha }}
          RELEASE_TAG: ${{ steps.run.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          script/validate-release
          VERSION="$(ruby -Ilib -rwoods/version -e 'print Woods::VERSION')"
          echo "gem-name=woods-${VERSION}.gem" >> "$GITHUB_OUTPUT"

  package-test:
    needs: release-context
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '3.0'
            rails: '~> 6.0.0'
            sqlite3: '~> 1.4'
          - ruby: '4.0'
            rails: '~> 8.1.0'
            sqlite3: '~> 2.7'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          ref: ${{ needs.release-context.outputs.release-sha }}
      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Download the exact release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.release-context.outputs.artifact-name }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.ci_run_id }}
      - name: Verify artifact SHA-256
        env:
          GEM_NAME: ${{ needs.release-context.outputs.gem-name }}
        run: cd dist && sha256sum --check "${GEM_NAME}.sha256"
      - name: Install package-test dependencies
        run: |
          gem install --no-document rspec -v '~> 3.13'
          gem install --no-document rails -v '${{ matrix.rails }}'
          gem install --no-document sqlite3 -v '${{ matrix.sqlite3 }}'
          gem install --no-document "dist/${{ needs.release-context.outputs.gem-name }}"
      - name: Test the installed artifact outside the repository load path
        env:
          WOODS_GEM_PATH: ${{ github.workspace }}/dist/${{ needs.release-context.outputs.gem-name }}
          WOODS_RUN_PACKAGE_SMOKE: '1'
        run: >-
          ruby -rrubygems -e 'load Gem.bin_path("rspec-core", "rspec")' --
          spec/integration/packaged_gem_spec.rb

  publish:
    needs: [release-context, package-test]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          ref: ${{ needs.release-context.outputs.release-sha }}
          fetch-depth: 0
      - name: Set up Ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1
        with:
          ruby-version: '3.3'
      - name: Download the tested release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.release-context.outputs.artifact-name }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.ci_run_id }}
      - name: Verify artifact SHA-256
        env:
          GEM_NAME: ${{ needs.release-context.outputs.gem-name }}
        run: cd dist && sha256sum --check "${GEM_NAME}.sha256"
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
        with:
          gem-server: https://rubygems.org
          audience: rubygems.org
      - name: Push the tested gem bytes to RubyGems
        env:
          GEM_NAME: ${{ needs.release-context.outputs.gem-name }}
          RELEASE_SHA: ${{ needs.release-context.outputs.release-sha }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        run: |
          set -euo pipefail
          script/verify-release-tag
          gem push "dist/${GEM_NAME}"

      # GitHub Release creation is intentionally separate from gem publication.
      # The API cannot atomically bind an existing tag to an expected commit;
      # create a release only after the tag's immutability is independently assured.
