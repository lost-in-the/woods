name: CI

on:
  pull_request:
    branches: [main, 'release/1.6.4']
  push:
    branches: ['release/1.6.4']
    tags: ['v1.6.4']

# Least-privilege default: CI only needs to read the checkout.
# Per-job blocks can opt into stronger scopes if they ever need to.
permissions:
  contents: read

jobs:
  # Unit specs against the base Gemfile (no full Rails — these stub it). The
  # Ruby axis spans the supported interpreters, including a Ruby 4.0 lane
  # (previously only verified by hand). tokenizers is install-gated off 4.0 in
  # the Gemfile; the suite falls back to the chars/token ratio there.
  test:
    name: Unit specs (Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.0', '3.1', '3.2', '3.3', '4.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake spec

  # Booted-app extraction across the supported Rails versions (#135/#136). Each
  # row boots the spec/dummy Rails app in-process against a pinned Rails and runs
  # a real end-to-end extraction (spec/integration/booted_extraction_spec.rb) —
  # the version-sensitive introspection gate the unit suite (which stubs Rails)
  # can't provide. The unit suite runs in the `test` job on the base Gemfile; it
  # is deliberately NOT re-run per Rails version — it stubs Rails, so it would add
  # bundle-difference noise without real version coverage, and the booted spec
  # can't share a process with it (hence the :booted_app tag + the solo run here).
  # Pairs are explicit to exclude invalid Ruby x Rails combinations (e.g. Rails
  # 6.0 only on Ruby 3.0; Rails 7.2 needs >= 3.1; Rails 8.0 needs >= 3.2).
  rails-matrix:
    name: Booted extraction (Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: '3.0', rails: '6.0' }
          - { ruby: '3.0', rails: '6.1' }
          - { ruby: '3.1', rails: '7.0' }
          - { ruby: '3.2', rails: '7.1' }
          - { ruby: '3.3', rails: '7.2' }
          - { ruby: '3.3', rails: '8.0' }
          - { ruby: '4.0', rails: '8.0' }
    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails }}.gemfile
      WOODS_RUN_BOOTED_APP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Ruby ${{ matrix.ruby }} (Rails ${{ matrix.rails }})
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run booted-app extraction
        run: bundle exec rspec spec/integration/booted_extraction_spec.rb

      - name: Run encrypted Console credential rotation
        run: bundle exec rspec spec/integration/console_credential_rotation_spec.rb

      - name: Run Console SQL policy
        run: bundle exec rspec spec/integration/console_sqlite_policy_spec.rb

      - name: Run Console resolved relation policy
        run: bundle exec rspec spec/integration/console_resolved_relation_policy_spec.rb

      - name: Verify typed Console policy
        run: bundle exec rspec spec/integration/console_typed_eav_policy_spec.rb

      - name: Run Console serialized credential policy
        run: bundle exec rspec spec/integration/console_credential_serialization_spec.rb

      - name: Run Console HTTP origin integration
        run: bundle exec rspec spec/integration/console_http_origins_spec.rb

      - name: Run Console HTTP mount integration
        run: bundle exec rspec spec/integration/console_http_mount_spec.rb

      - name: Run Console collection redaction
        run: bundle exec rspec spec/console/collection_redaction_spec.rb

  # Lint once, in its own job — style is Ruby-version-independent, and running
  # it inside every matrix row turned one offense into four red checks with
  # the real cause buried after the test output.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Run linter
        run: bundle exec rubocop

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Run tests with coverage
        run: COVERAGE=true bundle exec rake spec

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Check for dependency vulnerabilities
        run: bundle exec bundle-audit check --update

  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      gem-name: ${{ steps.artifact.outputs.gem-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build the maintenance artifact once
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(ruby -Ilib -rwoods/version -e 'print Woods::VERSION')"
          GEM_NAME="woods-${VERSION}.gem"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          mkdir -p dist
          gem build --strict --output "dist/${GEM_NAME}" woods.gemspec
          (cd dist && sha256sum "$GEM_NAME" > "${GEM_NAME}.sha256")
          echo "gem-name=${GEM_NAME}" >> "$GITHUB_OUTPUT"
      - name: Store the immutable gem and checksum
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: woods-release-${{ github.sha }}
          path: |
            dist/${{ steps.artifact.outputs.gem-name }}
            dist/${{ steps.artifact.outputs.gem-name }}.sha256
          if-no-files-found: error
          retention-days: 7

  maintenance-package:
    name: Installed maintenance package (Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: '3.0', rails: '6.0', rails-version: '~> 6.0.6', sqlite: '~> 1.4', mcp: '0.23.0' }
          - { ruby: '4.0', rails: '8.1', rails-version: '~> 8.1.0', sqlite: '~> 2.0', mcp: '' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Download the exact artifact built in this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - name: Verify artifact checksum
        env:
          GEM_NAME: ${{ needs.build.outputs.gem-name }}
        run: cd dist && sha256sum --check "${GEM_NAME}.sha256"
      - name: Install package-test dependencies
        env:
          GEM_NAME: ${{ needs.build.outputs.gem-name }}
        run: |
          if [ -n '${{ matrix.mcp }}' ]; then gem install --no-document mcp -v '${{ matrix.mcp }}'; fi
          gem install --no-document rspec -v '~> 3.13'
          gem install --no-document rails -v '${{ matrix.rails-version }}'
          gem install --no-document sqlite3 -v '${{ matrix.sqlite }}'
          gem install --no-document "dist/${GEM_NAME}"
      - name: Exercise the exact installed maintenance package
        env:
          WOODS_GEM_PATH: ${{ github.workspace }}/dist/${{ needs.build.outputs.gem-name }}
          WOODS_EXPECT_MCP_VERSION: ${{ matrix.mcp }}
        run: >-
          ruby -rrubygems -e 'load Gem.bin_path("rspec-core", "rspec")' --
          --options /dev/null spec/integration/maintenance_packaged_gem_spec.rb

  maintenance-security-backends:
    name: Maintenance security backends
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: woods
          POSTGRES_DB: woods_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: woods
          MYSQL_DATABASE: woods_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pwoods --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BUNDLE_GEMFILE: gemfiles/console_backends.gemfile
      WOODS_RUN_MAINTENANCE_SQL_BACKENDS: '1'
      WOODS_PG_URL: postgres://postgres:woods@localhost:5432/woods_test
      WOODS_MYSQL_URL: mysql2://root:woods@127.0.0.1:3306/woods_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up adapter qualification Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Exercise real Console output and dialect policies
        run: bundle exec rspec spec/integration/console_sql_dialects_spec.rb
