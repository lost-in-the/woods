name: CI

on:
  pull_request:
    branches: [main]
  # Also run on the merged state of the default branch. Triggering on
  # `pull_request` alone meant `main` itself was never tested: a bad merge
  # resolution, or a direct push, went green purely by absence of a run (#220).
  push:
    branches: [main]
    tags: ['v*']

# Least-privilege default: CI only needs to read the checkout.
# Per-job blocks can opt into stronger scopes if they ever need to.
permissions:
  contents: read

jobs:
  # Unit specs against the base Gemfile (no full Rails — these stub it). The
  # Ruby axis spans the supported interpreters, including a Ruby 4.0 lane
  # (previously only verified by hand). tokenizers is install-gated off 4.0 in
  # the Gemfile; the suite falls back to the chars/token ratio there.
  test:
    name: Unit specs (Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.0', '3.1', '3.2', '3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake spec

  # Booted-app extraction across the supported Rails versions (#135/#136). Each
  # row boots the spec/dummy Rails app in-process against a pinned Rails and runs
  # a real end-to-end extraction (spec/integration/booted_extraction_spec.rb) —
  # the version-sensitive introspection gate the unit suite (which stubs Rails)
  # can't provide. The unit suite runs in the `test` job on the base Gemfile; it
  # is deliberately NOT re-run per Rails version — it stubs Rails, so it would add
  # bundle-difference noise without real version coverage, and the booted spec
  # can't share a process with it (hence the :booted_app tag + the solo run here).
  # Pairs are explicit to exclude invalid Ruby x Rails combinations (e.g. Rails
  # 6.0 only on Ruby 3.0; Rails 7.2 needs >= 3.1; Rails 8.0 and 8.1 need >= 3.2).
  rails-matrix:
    name: Booted extraction (Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: '3.0', rails: '6.0' }
          - { ruby: '3.0', rails: '6.1' }
          - { ruby: '3.1', rails: '7.0' }
          - { ruby: '3.2', rails: '7.1' }
          - { ruby: '3.3', rails: '7.2' }
          - { ruby: '3.3', rails: '8.0' }
          - { ruby: '3.4', rails: '8.1' }
          - { ruby: '4.0', rails: '8.0' }
          - { ruby: '4.0', rails: '8.1' }
    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails }}.gemfile
      WOODS_RUN_BOOTED_APP: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - name: Set up Ruby ${{ matrix.ruby }} (Rails ${{ matrix.rails }})
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run booted-app extraction
        run: bundle exec rspec spec/integration/booted_extraction_spec.rb

      # Differential harness for incremental extraction (#164): random
      # create/modify/delete/rename sequences, compared against a cold full
      # extraction at every step. Runs in its own process — like the spec
      # above, it boots the dummy app and can't share one.
      - name: Run incremental equivalence harness
        run: bundle exec rspec spec/integration/incremental_equivalence_spec.rb

      # Watch daemon against a real booted app (#164 phase 2). Own process for
      # the same reason as the two above — each boots its own Rails app.
      - name: Run watch daemon integration
        run: bundle exec rspec spec/integration/watch_daemon_spec.rb

      # Six worktrees, disjoint indexes, concurrent readers (#164 phase 4).
      - name: Run multi-worktree integration
        run: bundle exec rspec spec/integration/multi_worktree_spec.rb

  # Storage adapters against REAL servers (#220). Every other storage spec uses
  # doubles, which verify the SQL/HTTP the adapter builds but not what a server
  # does with it — #181 (PG::CardinalityViolation on a duplicate id inside one
  # batch) shipped because no lane ever sent a real batch to a real PostgreSQL.
  live-backends:
    name: Live backends (pgvector + Qdrant)
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/live_backends.gemfile
      WOODS_RUN_LIVE_BACKENDS: '1'
      WOODS_PG_URL: postgres://postgres:postgres@localhost:5432/woods_test
      WOODS_QDRANT_URL: http://localhost:6333
    services:
      # pgvector's own image — the stock postgres image has no vector extension,
      # so `CREATE EXTENSION vector` in ensure_schema! would fail.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: woods_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # No health-cmd: the Qdrant image ships no shell utilities to probe with,
      # so readiness is waited on from the runner instead (step below).
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:6333/readyz > /dev/null; then
              echo "Qdrant ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Qdrant did not become ready within 30s"
          exit 1
      - name: Run live-backend contract specs
        run: bundle exec rspec spec/integration/live_backends_spec.rb

  # Lint once, in its own job — style is Ruby-version-independent, and running
  # it inside every matrix row turned one offense into four red checks with
  # the real cause buried after the test output.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Verify release-v2 public-surface inventory
        run: bundle exec rake release_v2:verify_surface_inventory
      - name: Run linter
        run: bundle exec rubocop

  # Drives both packaged MCP executables with the official Ruby client and the
  # pinned Inspector CLI, including a real HTTP socket. Its own job because the
  # process boundaries and Node dependency are intentionally outside unit specs.
  http-transport:
    name: MCP transports (official clients)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Set up Node 22.19.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Install pinned Inspector
        run: npm ci --ignore-scripts
      - name: Run MCP process contracts
        env:
          WOODS_RUN_HTTP_SERVER: '1'
          WOODS_RUN_MCP_INSPECTOR: '1'
        run: >-
          bundle exec rspec
          spec/mcp/http_server_e2e_spec.rb
          spec/integration/mcp_official_ruby_client_spec.rb
          spec/integration/mcp_inspector_contract_spec.rb

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Run tests with coverage
        run: COVERAGE=true bundle exec rake spec

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Check for dependency vulnerabilities
        run: bundle exec bundle-audit check --update

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1
        with:
          ruby-version: '3.3.10'
          bundler-cache: true
      - name: Build the release artifact once
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(ruby -Ilib -rwoods/version -e 'print Woods::VERSION')"
          GEM_NAME="woods-${VERSION}.gem"
          ARTIFACT_NAME="woods-release-${GITHUB_SHA}"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          mkdir -p dist
          gem build --strict --output "dist/${GEM_NAME}" woods.gemspec
          (cd dist && sha256sum "$GEM_NAME" > "${GEM_NAME}.sha256")
          echo "artifact-name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "gem-name=${GEM_NAME}" >> "$GITHUB_OUTPUT"
      - name: Store the gem and SHA-256 manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.artifact-name }}
          path: |
            dist/${{ steps.artifact.outputs.gem-name }}
            dist/${{ steps.artifact.outputs.gem-name }}.sha256
          if-no-files-found: error
          retention-days: 7
